name: mobile_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # --- ADDED for multi-language support ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # -----------------------------------------

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.11.0+2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  geolocator: ^13.0.1
  fuzzywuzzy: ^1.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.3.0
  flutter_contacts: ^1.1.9+2
  country_code_picker: ^3.0.0
  geocoding: ^3.0.0
  google_fonts: ^6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  hive_ce_generator: ^1.5.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true   # ADDED — tells Flutter to run gen-l10n and create lib/l10n/app_localizations.dart
  assets:
    - assets/Zhini_Icon1.png
    - assets/Zhini_Logo1.png
    - assets/images/
    - assets/model.tflite
    - assets/labels.txt
    - assets/companies.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Zhini_Icon1.png"