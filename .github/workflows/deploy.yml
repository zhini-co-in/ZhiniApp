name: Deploy to Google Play Internal Testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dynamic Version Code
        id: versioning
        run: |
          # Formats as YYMMDD (e.g., 261110) + 2-digit run number (e.g., 01, 02)
          DATE_PREFIX=$(date +'%y%m%d')
          RUN_SEQ=$(printf "%02d" $((GITHUB_RUN_NUMBER % 100)))
          VERSION_CODE="${DATE_PREFIX}${RUN_SEQ}"

          # Extract base version (e.g. 1.0.0) from pubspec.yaml
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0.0"
          fi

          echo "Calculated Version Code: $VERSION_CODE"
          echo "Calculated Version Name: $BASE_VERSION"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$BASE_VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore & configure key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number=${{ steps.versioning.outputs.version_code }}

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.zhini.mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed